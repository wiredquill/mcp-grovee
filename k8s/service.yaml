apiVersion: v1
kind: Service
metadata:
  name: mcp-govee-server
  namespace: mcp-govee
  labels:
    app: mcp-govee
    component: server
spec:
  type: ClusterIP
  selector:
    app: mcp-govee
    component: server
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
---
# Optional: NodePort service for external access during testing
apiVersion: v1
kind: Service
metadata:
  name: mcp-govee-server-nodeport
  namespace: mcp-govee
  labels:
    app: mcp-govee
    component: server
spec:
  type: NodePort
  selector:
    app: mcp-govee
    component: server
  ports:
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30080  # Choose an available port in range 30000-32767
    protocol: TCP
