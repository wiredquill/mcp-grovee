apiVersion: v1
kind: Secret
metadata:
  name: govee-credentials
  namespace: mcp-govee
type: Opaque
stringData:
  # Replace with your actual Govee API key
  GOVEE_API_KEY: "your_govee_api_key_here"
  # Optional: Specific device address
  GOVEE_DEVICE_ADDRESS: ""
  # Optional: Specific device model
  GOVEE_DEVICE_MODEL: ""
---
